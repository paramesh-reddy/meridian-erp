<!doctype html>
<html>
<body style="font-family: Arial, sans-serif; background: #f8fafc; color: #0f172a; padding: 24px;">
  <div style="max-width: 600px; margin: 0 auto; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 24px;">
    <h2 style="margin: 0 0 8px; color: #16a34a;">Order {{ order_number }} — Approved</h2>
    <p style="color: #475569; font-size: 14px;">Your sales order has been approved and confirmed.</p>
    <table style="width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 14px;">
      <tr><td style="padding: 6px 0; color: #64748b;">Status</td><td style="font-weight: 600; color: #16a34a;">CONFIRMED</td></tr>
      <tr><td style="padding: 6px 0; color: #64748b;">Approved By</td><td>{{ manager_name }}</td></tr>
      <tr><td style="padding: 6px 0; color: #64748b;">Approval Date</td><td>{{ decision_date }}</td></tr>
      <tr><td style="padding: 6px 0; color: #64748b;">Order Amount</td><td style="font-weight: 700;">{{ grand_total }}</td></tr>
    </table>
    <a href="{{ order_link }}" style="display: inline-block; background: #0f172a; color: #ffffff; text-decoration: none; padding: 10px 18px; border-radius: 6px; font-weight: 600; font-size: 14px;">View Sales Order</a>
  </div>
</body>
</html>
